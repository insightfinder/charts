replicaCount: 1

image:
  repository: docker.io/insightfinderinc/kservectl
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

# Namespace kservectl manages InferenceServices in. Empty means the release's own,
# which is the only one this chart's Role and RoleBinding authorise it in.
namespace: ""

logLevel: INFO

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - kservectl-stage.insightfinder.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# The app's own probes. Liveness checks nothing but the process, so a failing
# dependency cannot get a healthy container restarted; readiness loads both config
# files, and fails while either of them is unreadable.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# What each GPU type gives a pod, rendered into conf.d/accelerators.yaml. The key is
# the value this cluster's GPU nodegroups carry under `node_selector_key`, so a pod is
# pinned by its key alone; an entry that is not a node label value has to say where it
# runs with its own `node_selector`. Requests and limits are generated from these and
# are always equal, which is what puts a GPU pod in the Guaranteed QoS class.
#
# `cpu` and `memory` are the pod's; `gpu_memory_gb` is one card's VRAM, which is the
# number that decides whether a model's weights fit and is reported on
# `GET /api/v1/accelerators` rather than used. `default_dtype` is the precision
# everything placed here is served at unless an inference service names its own -- a
# property of the card, since a T4 has no bfloat16 at all, so a bf16-capable
# accelerator writes it once here instead of in every preset. `display_name` and
# `description` are for whatever renders the picker.
#
# `kservectl accelerator discover --cluster X` prints this block, read off a live
# cluster's nodegroups, `gpu_memory_gb` included.
#
# Empty on purpose, and not defaulted: Helm merges maps rather than replacing them, so
# a default set here would be *added* to whatever a cluster declares, leaving it
# offering GPU types it does not have. A cluster that declares none fails kservectl's
# startup by name, which is the right way to find out.
accelerators:
  {}
  # nvidia-t4-16gb-x1:
  #   cpu: 3
  #   memory: 14Gi
  #   gpu: 1
  #   gpu_memory_gb: 16
  #   display_name: NVIDIA T4 16GB x1
  #   description: One T4. Turing, so no bfloat16 -- weights are served at half precision.
  #
  # A card that can serve bf16 says so once, rather than every preset on it remembering:
  # nvidia-l40s-48gb-x1: {cpu: 6, memory: 56Gi, gpu: 1, gpu_memory_gb: 48, default_dtype: auto}
  #
  # CPU only, and deliberately not pinned to any GPU nodegroup:
  # cpu-only: {cpu: 1, memory: 2Gi, gpu: 0, node_selector: {}}

# The node label an accelerator's key is matched against. Optional; kservectl's own
# default is `insightfinder.com/accelerator`.
#
# There is no `default_accelerator` any more: sizing is never guessed, so a deploy that
# names no accelerator is refused. A values file that still sets that key -- or any of
# the other keys 0.1.x read -- fails this chart's render by name, naming what to write
# instead (`kservectl.validateValues` in _helpers.tpl).
node_selector_key: ""

# The inference services this cluster predefines, rendered into conf.d/presets.yaml. The
# key is the name each one deploys as, and `PUT /api/v1/inferenceservices/<key>` brings
# it up. An entry names an accelerator rather than writing its own resources or node
# selector.
presets:
  {}
  # smollm2:
  #   model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  #   accelerator: cpu-only
  #   backend: huggingface
  #   min_replicas: 1
