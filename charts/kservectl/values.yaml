replicaCount: 1

image:
  repository: docker.io/insightfinderinc/kservectl
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - kservectl-stage.insightfinder.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

models: {}
  # Example model configurations
  # smollm2:
  #   model_id: HuggingFaceTB/SmolLM2-135M-Instruct
  #   backend: huggingface
  #   saved_on_pvc: false
  #   min_replicas: 1
  #   resources:
  #     requests:
  #       cpu: 1
  #       memory: 2Gi
  #     limits:
  #       cpu: 1
  #       memory: 2Gi
