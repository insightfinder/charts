{{/* Rendered key by key rather than with toYaml: toYaml iterates the values map in Go's
     random order, so the same values produce a different ConfigMap body on every render.
     `range` sorts, and toJson is valid YAML. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kservectl.fullname" . }}-accelerators
  labels:
    {{- include "kservectl.labels" . | nindent 4 }}
data:
  accelerators.yaml: |
    {{- with .Values.node_selector_key }}
    node_selector_key: {{ . }}
    {{- end }}
    {{- with .Values.default_accelerator }}
    default_accelerator: {{ . }}
    {{- end }}
    accelerators:{{ if not .Values.accelerators }} {}{{ end }}
      {{- range $name, $spec := .Values.accelerators }}
      {{ $name }}: {{ toJson $spec }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kservectl.fullname" . }}-presets
  labels:
    {{- include "kservectl.labels" . | nindent 4 }}
data:
  presets.yaml: |
    presets:{{ if not .Values.presets }} {}{{ end }}
      {{- range $name, $spec := .Values.presets }}
      {{ $name }}: {{ toJson $spec }}
      {{- end }}
