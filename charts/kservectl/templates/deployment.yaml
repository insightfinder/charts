{{- $confDir := "/app/conf.d" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kservectl.fullname" . }}
  labels:
    {{- include "kservectl.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kservectl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kservectl.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kservectl.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KSERVECTL_NAMESPACE
              value: {{ .Values.namespace | default .Release.Namespace | quote }}
            - name: KSERVECTL_CONF_DIR
              value: {{ $confDir | quote }}
            - name: KSERVECTL_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: presets
              mountPath: {{ $confDir }}/presets.yaml
              subPath: presets.yaml
            - name: accelerators
              mountPath: {{ $confDir }}/accelerators.yaml
              subPath: accelerators.yaml
      volumes:
        - name: presets
          configMap:
            name: {{ include "kservectl.fullname" . }}-presets
        - name: accelerators
          configMap:
            name: {{ include "kservectl.fullname" . }}-accelerators
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
