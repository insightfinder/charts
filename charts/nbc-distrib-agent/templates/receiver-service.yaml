apiVersion: v1
kind: Service
metadata:
  name: {{ include "nbc-distrib-agent.fullname" . }}-receiver
  labels:
    {{- include "nbc-distrib-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
spec:
  type: ClusterIP
  selector:
    {{- include "nbc-distrib-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP