kafka:
  brokers:
    - "kafka-controller-headless.insightfinder:9092"
  compression: "snappy"
  retry_max: 3
  required_acks: -1
  timeout: 30s
  batch_size: 100
  batch_timeout: 2s

# Redis configuration for distributed metrics
redis:
  enabled: true
  addr: "valkey-primary:6379"
  password: ""
  db: 0
  prefix: "nbcredisdev"  # Environment prefix (nbcredisdev, nbcredisstage, nbcredisprod) - prevents key collisions

servicenow:
  enabled: false
  url: "https://instance.service-now.com"
  username: "your_username"
  password: "your_password"
  client_id: "your_client_id"
  client_secret: "your_client_secret"

# Data quality configuration (optional)
# When enabled, data for a mapped source is also sent to its data quality project.
dataquality:
  enabled: false
  insightfinder:
    endpoint: ""
    username: ""
    licensekey: ""
  projects: {}
    # Conviva: "conviva-model-v1"
  targets: []
    # - insightfinder:
    #     endpoint: "https://stg.insightfinder.com"
    #     username: ""
    #     licensekey: ""
    #   projects:
    #     conviva: "conviva-model-v1"

# NBC Metadata Agent (SLEM) configuration (optional)
# When enabled, the processor derives a Video Asset PID from Touchstream/Harmonic
# SLE alerts, looks up the matching SLEM catalog entry (vendorEventID for
# Touchstream, eventId for Harmonic) via the nbc-metadata-agent service, and
# unpacks the result into tags.LEM_* fields. Eligible sources, stream types,
# and propositions are hardcoded in the processor, not configured here.
nbc_metadata:
  enabled: false
  url: "http://nbc-metadata-agent:8080"
  username: "admin"
  password: "admin"
  timeout: 10

# Global Commerce (GC) escalation field extraction (optional)
# When enabled, alerts from the "gc" source are enriched with GC escalation
# fields for the listed countries.
globalCommerce:
  enabled: false
  countries: []

receiver:
  replicaCount: 3
  image:
    repository: insightfinderinc/nbc-data-receiver
    pullPolicy: Always
    tag: "main"
  imagePullSecrets:
    - name: regcred
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: "1"
      memory: 256Mi
  
  nodeSelector: {}
  tolerations: []
  affinity: {}
  volumeMounts: []
  volumes: []
  env: []

  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    host: "nbc-receiver-stg.insightfinder.com"
    path: "/"
    pathType: "Prefix"
    tls: []
    servicePort:
      name: "http"

  config:
    server:
      read_timeout: 30s
      write_timeout: 30s
    
    logging:
      level: "info"
      development: false
      disable_stacktrace: true
    
    security:
      enabled: false
      allowedUserAgents:
        - "Go-http-client/*"
      alertOnTestData: false

    auth:
      enabled: true
      allowed_users:
        nbc_stg_user:
          username: "maoyuwang"
          license_key: "595bf1a9253e982b0e3951a1d8ba634fdae19cb3"

processor:
  replicaCount: 1
  image:
    repository: insightfinderinc/nbc-data-processor
    pullPolicy: Always
    tag: "main"
  imagePullSecrets:
    - name: regcred
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: "1"
      memory: 256Mi
  
  nodeSelector: {}
  tolerations: []
  affinity: {}
  volumeMounts: []
  volumes: []
  env: []
  
  data_sources:
    enabled:
      - "Harmonic"
      - "Conviva"
      - "Touchstream"
      - "Thanos"
    configs:
      default:
        # Data source identifier (will be dynamically set from the payload's source field)
        source_name: "DEFAULT"

        # Instance identifier field
        instance_field: "alert.core.monitored_item"
        # Default instance if instance_field cannot be extracted
        default_instance: "UNKNOWN"

        component_field: "alert.core.configuration_item"
        default_component: "UNKNOWN"

        # Timestamp field to extract (use alert.core.timestamp which contains the actual timestamp)
        timestamp_field: "alert.metadata.received_at"

        # Optional timezone of the timestamp (if TZ naive)
        timestamp_timezone: "UTC"

        # InsightFinder configuration
        insightfinder:
          user_name: ""
          license_key: ""
          token: ""
          project_name: "default-project"  # Will be dynamically set to the source field from payload
          project_name_suffix: ""  # Will be appended to source name during dynamic project creation
          system_name: "maoyu-test-nbc-agent"
          project_type: "log"
          containerize: false
          sampling_interval: 900
          run_interval: 900
          chunk_size_kb: 2048
          if_url: "https://stg.insightfinder.com"
          if_http_proxy: ""
          if_https_proxy: ""
          collector_type: "logfilereplay"

      Conviva:
        # Data source identifier
        source_name: Conviva

        # Instance identifier field
        instance_field: "alert.core.monitored_item"
        # Default instance if instance_field cannot be extracted
        default_instance: "Conviva"

        # Component field mapping (optional)
        component_field: "DATASOURCENAME + alert.additional_fields.product + alert.core.proposition + alert.asset.stream_type"
        default_component: ""

        # Timestamp field to extract (use alert.core.timestamp which contains the actual timestamp)
        timestamp_field: "alert.metadata.received_at"

        # Optional timezone of the timestamp (if TZ naive)
        timestamp_timezone: "America/New_York"

        # InsightFinder configuration
        insightfinder:
          user_name: ""
          license_key: ""
          token: ""
          project_name: "maoyu-test-nbc-agent-conviva"
          system_name: "maoyu-test-nbc-agent"
          project_type: "log"
          containerize: false
          sampling_interval: 10
          run_interval: 10
          chunk_size_kb: 2048
          if_url: "https://stg.insightfinder.com"
          if_http_proxy: ""
          if_https_proxy: ""
          collector_type: "logfilereplay"

      Harmonic:
