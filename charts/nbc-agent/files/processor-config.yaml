# Application configuration
app:
  name: "Data Processor Agent"
  version: "1.0.0"
  environment: "development"

kafka:
  brokers: {{ toYaml .Values.kafka.brokers | nindent 4 }}
  topic: {{ include "nbc-agent.fullname" . }}
  group_id: "data-processor-group"
  # Consumer settings
  auto_offset_reset: "latest"  # earliest, latest - use latest to avoid replaying old messages
  enable_auto_commit: true  # Enable auto-commit to persist offsets
  session_timeout: 10000  # milliseconds
  heartbeat_interval: 3000  # milliseconds
  max_poll_interval: 300000  # 5 minutes
  max_poll_records: 500
  # Worker pool settings
  worker_pool_size: 10
  batch_size: {{ .Values.kafka.batch_size }}
  batch_timeout: {{ .Values.kafka.batch_timeout }}  # must include time unit: s, m, h

logging:
  level: {{ .Values.receiver.config.logging.level | quote }}
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"
  development: {{ .Values.receiver.config.logging.development }}
  disable_stacktrace: {{ .Values.receiver.config.logging.disable_stacktrace }}

# Data source configurations directory
data_sources:
  config_dir: "./config"
  # List of enabled data sources
  enabled:
  {{- range .Values.processor.data_sources.enabled }}
    - {{ . | quote }}
  {{- end }}

# Redis configuration for distributed metrics
redis:
  enabled: {{ .Values.redis.enabled }}
  addr: {{ .Values.redis.addr | quote }}
  password: {{ .Values.redis.password | quote }}
  db: {{ .Values.redis.db }}
  prefix: {{ .Values.redis.prefix | quote }}

servicenow:
  enabled: {{ .Values.servicenow.enabled | default false }}
  url: {{ .Values.servicenow.url | quote }}
  username: {{ .Values.servicenow.username | quote }}
  password: {{ .Values.servicenow.password | quote }}
  client_id: {{ .Values.servicenow.client_id | quote }}
  client_secret: {{ .Values.servicenow.client_secret | quote }}

# Data quality configuration (optional)
dataquality:
  enabled: {{ .Values.dataquality.enabled | default false }}
  insightfinder:
    endpoint: {{ .Values.dataquality.insightfinder.endpoint | quote }}
    username: {{ .Values.dataquality.insightfinder.username | quote }}
    licensekey: {{ .Values.dataquality.insightfinder.licensekey | quote }}
  projects:
  {{- range $source, $project := .Values.dataquality.projects }}
    {{ $source | quote }}: {{ $project | quote }}
  {{- end }}
  {{- if .Values.dataquality.targets }}
  targets:
  {{- toYaml .Values.dataquality.targets | nindent 4 }}
  {{- end }}

# NBC Metadata Agent (SLEM) configuration (optional)
nbc_metadata:
  enabled: {{ .Values.nbc_metadata.enabled | default false }}
  url: {{ .Values.nbc_metadata.url | quote }}
  username: {{ .Values.nbc_metadata.username | quote }}
  password: {{ .Values.nbc_metadata.password | quote }}
  timeout: {{ .Values.nbc_metadata.timeout | default 10 }}

# Global Commerce (GC) escalation field extraction (optional)
globalCommerce:
  enabled: {{ .Values.globalCommerce.enabled | default false }}
  useNewGCWorkflow: {{ .Values.globalCommerce.useNewGCWorkflow | default false }}
  countries:
  {{- range .Values.globalCommerce.countries }}
    - {{ . | quote }}
  {{- end }}