apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nbc-metadata-agent.fullname" . }}
  labels:
    {{- include "nbc-metadata-agent.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.postgres.host | quote }}
  DB_PORT: {{ .Values.postgres.port | toString | quote }}
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
