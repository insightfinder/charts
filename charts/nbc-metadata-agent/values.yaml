replicaCount: 1

image:
  repository: insightfinderinc/nbc-metadata-agent
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

# Full application.yaml content mounted into the container at /config/application.yaml
config: |
  spring:
    main:
      banner-mode: "off"
    application:
      name: nbc-metadata-agent
    datasource:
      url: jdbc:postgresql://localhost:5432/mydb
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      open-in-view: false
  authentication:
    credentials:
      - username: admin
        licenseKey: admin
  springdoc:
    swagger-ui:
      path: /api
    api-docs:
      path: /openapi.json

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - nbc-metadata-stage.insightfinder.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 500m
    memory: 500Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
