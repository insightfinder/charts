apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "email-agent.mainAgent.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "email-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: main-agent
spec:
  replicas: {{ .Values.mainAgent.replicas }}
  selector:
    matchLabels:
      app: {{ include "email-agent.mainAgent.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "email-agent.mainAgent.fullname" . }}
        app.kubernetes.io/component: main-agent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: main-agent
        image: "{{ .Values.mainAgent.image.repository }}:{{ .Values.mainAgent.image.tag }}"
        imagePullPolicy: {{ .Values.mainAgent.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.mainAgent.port }}
        env:
        - name: MAIN_AGENT_TEMPORAL_ADDRESS
          value: {{ .Values.temporal.address | quote }}
        - name: MAIN_AGENT_TEMPORAL_NAMESPACE
          value: {{ .Values.temporal.namespace | quote }}
        - name: MAIN_AGENT_TEMPORAL_TASK_QUEUE
          value: {{ .Values.mainAgent.taskQueue | quote }}
        # Resolved from the subagent's own Service in this same release, so
        # the two can never be pointed at each other wrongly.
        - name: EMAIL_SUBAGENT_URL
          value: "http://{{ include "email-agent.subagent.fullname" . }}:{{ .Values.emailSubagent.port }}"
        - name: SMTP_HOST
          value: {{ .Values.mainAgent.smtp.host | quote }}
        - name: SMTP_PORT
          value: {{ .Values.mainAgent.smtp.port | quote }}
        {{- with .Values.mainAgent.smtp.from }}
        - name: SMTP_FROM
          value: {{ . | quote }}
        {{- end }}
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: smtp-username
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName }}
              key: smtp-password
        {{- include "email-agent.tracingEnv" . | nindent 8 }}
        resources:
          {{- toYaml .Values.mainAgent.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.mainAgent.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.mainAgent.port }}
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "email-agent.mainAgent.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "email-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: main-agent
spec:
  selector:
    app: {{ include "email-agent.mainAgent.fullname" . }}
  ports:
  - port: {{ .Values.mainAgent.port }}
    targetPort: {{ .Values.mainAgent.port }}
    name: http
