{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evenup-trace-proxy.secretName" . }}
  labels:
    {{- include "evenup-trace-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
