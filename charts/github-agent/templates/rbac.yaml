# Lets github-agent spawn and monitor its own isolated, per-task sandbox
# Jobs, and clean up the per-task Secret it creates to pass credentials into
# them. Namespaced, least-privilege -- no cluster-wide access, no pod
# create/delete (the Job owns its own Pod).
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "github-agent.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "github-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-agent.fullname" . }}-sandbox-job
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "github-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-agent.fullname" . }}-sandbox-job
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "github-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "github-agent.fullname" . }}
    namespace: {{ .Values.namespace | default .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-agent.fullname" . }}-sandbox-job
{{- end }}
