apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-agent.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "github-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "github-agent.fullname" . }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "github-agent.fullname" . }}
    spec:
      serviceAccountName: {{ include "github-agent.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: github-agent
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.port }}
        env:
        - name: ONCALL_TEMPORAL_ADDRESS
          value: {{ .Values.temporal.address | quote }}
        - name: ONCALL_TEMPORAL_NAMESPACE
          value: {{ .Values.temporal.namespace | quote }}
        - name: ONCALL_TEMPORAL_TASK_QUEUE
          value: {{ .Values.temporal.taskQueue | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-agent.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "github-agent.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "github-agent.fullname" . }}
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
    name: http
