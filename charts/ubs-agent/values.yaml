# Default values for ubs-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: insightfinderinc/ubs-agent
  pullPolicy: Always
  # Tag example: "latest@sha256:cb5c1bddd1b5665e1867a7fa1b5fa843a47ee433bbb75d4293888b71def53229"
  # Pin a digest in production: a run interrupted mid-file is resumed by a
  # new pod, which must run the same agent build to resume it by chunk.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# API version passed to the agent as the API_VERSION env var.
apiVersion: ""

# Agent log level (LOG_LEVEL env var): INFO logs each file, a progress line
# every 30s while sending and a run summary; DEBUG also logs every HTTP chunk.
logLevel: INFO

# The agent runs once, downloads what's new, streams it, and exits -- so it
# is scheduled as a CronJob rather than a long-running Deployment.
# Default: once per day at 01:00 UTC.
schedule: "0 1 * * *"
timeZone: "UTC"
concurrencyPolicy: Forbid
suspend: false
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
startingDeadlineSeconds: 300
# Retries for a failed run within the same schedule. The agent checkpoints
# its progress, so each retry resumes where the last pod stopped rather than
# re-sending. With podFailurePolicy enabled, interruptions (node drains,
# evictions, the agent's graceful stop) don't count against this - only real
# errors do.
backoffLimit: 6
# Interruptions don't count against backoffLimit (see above) and the Job waits
# for an interrupted pod to fully stop before starting its replacement, so two
# pods never use the checkpoint at once. Stable since Kubernetes 1.31; on older
# clusters it needs the JobPodFailurePolicy feature gate - set false if
# unavailable.
podFailurePolicy:
  enabled: true
# Time limit (seconds) for the WHOLE run - every pod and retry together. When
# it passes, the Job is stopped and fails; the next scheduled run resumes where
# it stopped, so nothing is lost or duplicated, only delayed. Keep it below the
# schedule interval. 0 or empty = no limit. (Replaces activeDeadlineSeconds,
# which is still honoured, and wins, if set.)
jobActiveDeadlineSeconds: 21600
# Time limit (seconds) for ONE pod, after which it is stopped and the Job
# starts a new pod that resumes. 0 or empty = no limit.
podActiveDeadlineSeconds: 0
# Time (seconds) the pod gets on SIGTERM (node drain / Spot eviction) to finish
# in-flight chunks and flush its checkpoint before SIGKILL. Azure Spot gives
# only ~30s of real notice regardless.
terminationGracePeriodSeconds: 120

# Adds the karpenter.sh/do-not-disrupt: "true" pod annotation, so AKS Node
# Auto Provisioning (Karpenter) does not consolidate or drift the agent's node
# while a run is in progress. It does not prevent node expiry, Spot eviction,
# kubectl drain or upgrades, and a NodePool terminationGracePeriod overrides
# it. Set false if cluster policy doesn't allow the annotation; resume still
# prevents duplicates without it.
doNotDisrupt: true

# Optional PodDisruptionBudget for the agent pod. With a single pod only
# maxUnavailable: 0 protects it (1 allows the eviction). WARNING: on AKS any
# PDB with maxUnavailable 0 makes cluster and node pool upgrades fail with
# UnsatisfiablePDB, even while no agent pod is running - check with the
# platform team before enabling. Not needed for correctness: resume prevents
# duplicates without it.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 0

podAnnotations: {}
podLabels: {}

# UID/GID baked into the image (see UBSAgent's Dockerfile: `appuser`).
runAsId: 10001

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

appArmor:
  enabled: false

serviceAccount:
  # Set false to have the pod use an existing ServiceAccount instead (see `name`).
  create: true
  annotations: {}
  name: ""

# Azure authentication for StorageService (azure.identity.DefaultAzureCredential).
azure:
  # Client ID of the managed identity / workload identity used to read the
  # blob container. Required.
  clientId: ""
  # Set true on AKS clusters using Azure AD Workload Identity -- adds the
  # azure.workload.identity/use label to the pod so the webhook injects
  # AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE alongside AZURE_CLIENT_ID.
  # The ServiceAccount must be annotated with azure.workload.identity/client-id
  # (see serviceAccount.annotations).
  workloadIdentity:
    enabled: false

# Azure Blob Storage container the agent reads feed files from.
storage:
  account: ""
  container: ""

limitRange:
  enabled: false
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container

resourceQuota:
  enabled: false
  spec:
    hard:
      cpu: "2"
      memory: 2Gi
      pods: "2"

# The agent streams each file, so memory stays flat (~50-70 MB measured on a
# 1.5 GB feed) regardless of file size. It is single-threaded: a CPU limit
# above 1 does not help, and below 1 makes a run proportionally slower.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 128Mi

# emptyDir mounted at /app/data. The agent downloads and sends one file at a
# time (deleting each after it's sent), so size this to the LARGEST SINGLE file
# (compressed size for .gz) plus headroom - not the total of a run. A file that
# outgrows it gets the pod evicted and the run can't progress past it.
dataVolume:
  sizeLimit: 4Gi

# Persistent checkpoint so a pod that restarts (node drain, Spot eviction,
# rebalance) resumes without re-sending, instead of restarting the whole run.
# A single standard PVC is created once and reused by every run; it holds only
# a tiny checkpoint file. The agent locks it, so a second run started while one
# is active (e.g. a Job created by hand) exits instead of sharing it. Set type
# to anything other than "pvc" to disable the PVC (then also set
# config.checkpoint.backend: none).
persistence:
  enabled: true
  type: pvc
  # ReadWriteOnce (Azure Disk) is simplest. A locally-redundant (LRS) disk
  # pins the pod to the disk's zone; a zone-redundant one (skuName
  # StandardSSD_ZRS / Premium_ZRS) attaches in any zone - AKS's built-in disk
  # classes use ZRS on multi-zone clusters from Kubernetes 1.29. After a hard
  # node loss an RWO disk can take a while to detach before the new pod starts.
  # ReadWriteMany with an Azure Files storageClass avoids attaching altogether.
  accessMode: ReadWriteOnce
  # Checkpoint is tiny; Azure managed disks may round this up to their minimum.
  size: 1Gi
  # Empty = cluster default StorageClass. On AKS: managed-csi (Azure Disk) or
  # azurefile-csi (Azure Files, with accessMode ReadWriteMany).
  storageClass: ""
  # Where the PVC is mounted; must match config.checkpoint.path below.
  mountPath: /app/state

nodeSelector: {}

tolerations: []

affinity: {}

# Rendered verbatim into /app/config.yaml (see UBSAgent's config.py /
# README). The license key is not part of this block -- see `licenseKey`
# below.
config:
  # Optional, e.g. "2026-09-01" - leave blank to use today's date.
  historicalDate: ""

  # Optional, agent default false - take the date from the 4th HEADER field of
  # each file (YYYYMMDD) instead; overrides historicalDate. On here because each
  # file is one group's records for its HEADER date, so each file is sent in a
  # single pass. With it off, files of the same group share the run's date and
  # the agent first downloads every file once to count its rows, to spread each
  # group's records across its files.
  useFileDate: true

  # Optional, default true - spread each tag/instance's records evenly across
  # the day (see ignoreCurrentTime); false sends every record of the run with
  # one shared timestamp.
  uniqueTimestamps: true

  # Optional, default true - spread today's records across the whole day
  # (00:00:00.000 - 23:59:59.999 UTC); false stops at the run's start time so
  # none land in the future. Past dates always use the whole day.
  ignoreCurrentTime: true

  # Optional, default "00:00" / "23:59:59.999" - UTC times of day the records
  # are spread between (both included), e.g. "08:00" and "18:00".
  windowStartTime: "00:00"
  windowEndTime: "23:59:59.999"

  # Optional, e.g. 10 - place records on fixed slots this many minutes apart
  # from windowStartTime instead, split evenly in file order; all records in a slot
  # share its time and the earliest slots take any remainder. Overrides
  # uniqueTimestamps. Leave blank to spread per record.
  windowIntervalMinutes: ""

  # Optional, default 2048 - max size in KB of the log data in each HTTP
  # request to InsightFinder.
  maxChunkSizeKb: 2048

  # Optional, default 4 - HTTP requests sent to InsightFinder at once, while
  # the next chunk is prepared; 1 sends them one after another. Each request
  # in flight holds about 8 MB.
  sendConcurrency: 4

  # Durable progress so an interrupted run resumes without re-sending.
  checkpoint:
    # pvc = persist to the mounted PVC (see persistence above); none = stateless
    # (re-sends everything after any interruption).
    backend: pvc
    # Directory the checkpoint file is written to; must match
    # persistence.mountPath above.
    path: /app/state

  fileDownload:
    # Local download directory inside the container; must match the `data`
    # emptyDir mount path in templates/cronjob.yaml.
    destination: /app/data
    # Optional blob name prefix filter. The checkpoint is keyed on this: the
    # same prefix on restart resumes; a different prefix starts a fresh run.
    prefix: ""

  insightfinder:
    url: https://app.insightfinder.com
    username: ""
    project: ""

  transform:
    # Prefix each field key with "<table>@".
    include_group_name: true

  # One entry per feed table name (taken from each file's HEADER row) to the
  # ordered list of column names for that table. A file whose table has no
  # matching entry here is skipped with an error logged.
  mapping: {}
    # PRODUCT_KYC:
    #   - operation_type
    #   - abbreviation
    #   - description
    #   - active

# InsightFinder license key, delivered as the LICENSE_KEY env var.
licenseKey:
  # Ignored when existingSecret is set.
  value: ""
  # Name of a pre-existing Secret containing the license key.
  existingSecret: ""
  # Key within existingSecret (or the chart's own auto-created Secret).
  existingSecretKey: "LICENSE_KEY"
