# Default values for ubs-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: insightfinderinc/ubs-agent
  pullPolicy: Always
  # Tag example: "latest@sha256:cb5c1bddd1b5665e1867a7fa1b5fa843a47ee433bbb75d4293888b71def53229"
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# API version passed to the agent as the API_VERSION env var.
apiVersion: ""

# Agent log level (LOG_LEVEL env var): INFO logs each file, a progress line
# every 30s while sending and a run summary; DEBUG also logs every HTTP chunk.
logLevel: INFO

# The agent runs once, downloads what's new, streams it, and exits -- so it
# is scheduled as a CronJob rather than a long-running Deployment.
# Default: once per day at 01:00 UTC.
schedule: "0 1 * * *"
timeZone: "UTC"
concurrencyPolicy: Forbid
suspend: false
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
startingDeadlineSeconds: 300
# Give up retrying a run and let the next schedule try again.
backoffLimit: 2
# Hard ceiling on how long a single run may take before it's killed.
activeDeadlineSeconds: 3600

podAnnotations: {}
podLabels: {}

# UID/GID baked into the image (see UBSAgent's Dockerfile: `appuser`).
runAsId: 10001

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

appArmor:
  enabled: false

serviceAccount:
  # Set false to have the pod use an existing ServiceAccount instead (see `name`).
  create: true
  annotations: {}
  name: ""

# Azure authentication for StorageService (azure.identity.DefaultAzureCredential).
azure:
  # Client ID of the managed identity / workload identity used to read the
  # blob container. Required.
  clientId: ""
  # Set true on AKS clusters using Azure AD Workload Identity -- adds the
  # azure.workload.identity/use label to the pod so the webhook injects
  # AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE alongside AZURE_CLIENT_ID.
  # The ServiceAccount must be annotated with azure.workload.identity/client-id
  # (see serviceAccount.annotations).
  workloadIdentity:
    enabled: false

# Azure Blob Storage container the agent reads feed files from.
storage:
  account: ""
  container: ""

limitRange:
  enabled: false
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container

resourceQuota:
  enabled: false
  spec:
    hard:
      cpu: "2"
      memory: 2Gi
      pods: "2"

# The agent streams each file, so memory stays flat (~50-70 MB measured on a
# 1.5 GB feed) regardless of file size. It is single-threaded: a CPU limit
# above 1 does not help, and below 1 makes a run proportionally slower.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 128Mi

# emptyDir mounted at /app/data. Every file of a run is downloaded here before
# any is sent, so size it to the total of one run's files (compressed size
# for .gz) plus headroom - a run that outgrows it gets the pod evicted.
dataVolume:
  sizeLimit: 4Gi

nodeSelector: {}

tolerations: []

affinity: {}

# Rendered verbatim into /app/config.yaml (see UBSAgent's config.py /
# README). The license key is not part of this block -- see `licenseKey`
# below.
config:
  # Optional, e.g. "2026-09-01" - leave blank to use today's date.
  historicalDate: ""

  # Optional, default false - take the date from the 4th HEADER field of each
  # file (YYYYMMDD) instead; overrides historicalDate.
  useFileDate: false

  # Optional, default true - spread each tag/instance's records evenly across
  # the day (see ignoreCurrentTime); false sends every record of the run with
  # one shared timestamp.
  uniqueTimestamps: true

  # Optional, default true - spread today's records across the whole day
  # (00:00:00.000 - 23:59:59.999 UTC); false stops at the run's start time so
  # none land in the future. Past dates always use the whole day.
  ignoreCurrentTime: true

  # Optional, default "00:00" / "23:59:59.999" - UTC times of day the records
  # are spread between (both included), e.g. "08:00" and "18:00".
  windowStartTime: "00:00"
  windowEndTime: "23:59:59.999"

  # Optional, e.g. 10 - place records on fixed slots this many minutes apart
  # from windowStartTime instead, split evenly in file order; all records in a slot
  # share its time and the earliest slots take any remainder. Overrides
  # uniqueTimestamps. Leave blank to spread per record.
  windowIntervalMinutes: ""

  # Optional, default 2048 - max size in KB of the log data in each HTTP
  # request to InsightFinder.
  maxChunkSizeKb: 2048

  # Optional, default 4 - HTTP requests sent to InsightFinder at once, while
  # the next chunk is prepared; 1 sends them one after another. Each request
  # in flight holds about 8 MB.
  sendConcurrency: 4

  fileDownload:
    # Local download directory inside the container; must match the `data`
    # emptyDir mount path in templates/cronjob.yaml.
    destination: /app/data
    # Optional blob name prefix filter.
    prefix: ""

  insightfinder:
    url: https://app.insightfinder.com
    username: ""
    project: ""

  transform:
    # Prefix each field key with "<table>@".
    include_group_name: true

  # One entry per feed table name (taken from each file's HEADER row) to the
  # ordered list of column names for that table. A file whose table has no
  # matching entry here is skipped with an error logged.
  mapping: {}
    # PRODUCT_KYC:
    #   - operation_type
    #   - abbreviation
    #   - description
    #   - active

# InsightFinder license key, delivered as the LICENSE_KEY env var.
licenseKey:
  # Ignored when existingSecret is set.
  value: ""
  # Name of a pre-existing Secret containing the license key.
  existingSecret: ""
  # Key within existingSecret (or the chart's own auto-created Secret).
  existingSecretKey: "LICENSE_KEY"
