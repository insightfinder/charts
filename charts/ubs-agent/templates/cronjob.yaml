apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ubs-agent.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ubs-agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  suspend: {{ .Values.suspend }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  {{- if .Values.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  {{- end }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      {{- if .Values.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          annotations:
            {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.appArmor.enabled }}
            container.apparmor.security.beta.kubernetes.io/{{ .Chart.Name }}: runtime/default
            {{- end }}
          labels:
            {{- include "ubs-agent.selectorLabels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.azure.workloadIdentity.enabled }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          serviceAccountName: {{ include "ubs-agent.serviceAccountName" . }}
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: STORAGE_ACCOUNT
                  value: {{ .Values.storage.account | quote }}
                - name: STORAGE_CONTAINER
                  value: {{ .Values.storage.container | quote }}
                - name: AZURE_CLIENT_ID
                  value: {{ .Values.azure.clientId | quote }}
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: config
              secret:
                secretName: {{ include "ubs-agent.fullname" . }}-config
            - name: data
              emptyDir:
                sizeLimit: 512Mi
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
