{{- $cp := .Values.config.checkpoint | default dict }}
{{- $pvcOn := and .Values.persistence.enabled (eq .Values.persistence.type "pvc") }}
{{- if and (eq ($cp.backend | default "pvc") "pvc") (not $pvcOn) }}
{{- fail "config.checkpoint.backend is 'pvc' but no PVC is enabled: enable persistence (persistence.enabled=true, type=pvc) or set config.checkpoint.backend: none. Writing the checkpoint to an unmounted path fails on the read-only root filesystem." }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ubs-agent.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ubs-agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  suspend: {{ .Values.suspend }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  {{- if .Values.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  {{- end }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      {{- /* activeDeadlineSeconds is the old name of jobActiveDeadlineSeconds; it wins when set */}}
      {{- with (.Values.activeDeadlineSeconds | default .Values.jobActiveDeadlineSeconds) }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- if .Values.podFailurePolicy.enabled }}
      # Interruptions don't use up backoffLimit: node drains, evictions and
      # preemption (DisruptionTarget), and the agent's own graceful stop on
      # SIGTERM (exit 143) - it has saved its progress and the next pod
      # resumes. Also makes the Job wait for the old pod to fully stop before
      # starting its replacement, so two pods never share the checkpoint.
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
                status: "True"
          - action: Ignore
            onExitCodes:
              operator: In
              values: [143]
      {{- end }}
      template:
        metadata:
          annotations:
            {{- if and .Values.doNotDisrupt (not (hasKey (.Values.podAnnotations | default dict) "karpenter.sh/do-not-disrupt")) }}
            # Ask NAP (Karpenter) not to consolidate or drift this pod's node
            # while a run is in progress.
            karpenter.sh/do-not-disrupt: "true"
            {{- end }}
            {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.appArmor.enabled }}
            container.apparmor.security.beta.kubernetes.io/{{ .Chart.Name }}: runtime/default
            {{- end }}
          labels:
            {{- include "ubs-agent.selectorLabels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.azure.workloadIdentity.enabled }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          serviceAccountName: {{ include "ubs-agent.serviceAccountName" . }}
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with .Values.podActiveDeadlineSeconds }}
          activeDeadlineSeconds: {{ . }}
          {{- end }}
          {{- with .Values.terminationGracePeriodSeconds }}
          # Time for the agent to finish in-flight chunks and flush its
          # checkpoint on SIGTERM (node drain / Spot eviction) before SIGKILL.
          terminationGracePeriodSeconds: {{ . }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: STORAGE_ACCOUNT
                  value: {{ .Values.storage.account | quote }}
                - name: STORAGE_CONTAINER
                  value: {{ .Values.storage.container | quote }}
                - name: AZURE_CLIENT_ID
                  value: {{ .Values.azure.clientId | quote }}
                - name: API_VERSION
                  value: {{ .Values.apiVersion | quote }}
                - name: LOG_LEVEL
                  value: {{ .Values.logLevel | quote }}
                - name: LICENSE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "ubs-agent.licenseSecretName" . }}
                      key: {{ include "ubs-agent.licenseSecretKey" . }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: config
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
                {{- if and .Values.persistence.enabled (eq .Values.persistence.type "pvc") }}
                - name: state
                  mountPath: {{ .Values.persistence.mountPath }}
                {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: config
              secret:
                secretName: {{ include "ubs-agent.fullname" . }}-config
            - name: data
              emptyDir:
                sizeLimit: {{ .Values.dataVolume.sizeLimit }}
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
            {{- if and .Values.persistence.enabled (eq .Values.persistence.type "pvc") }}
            - name: state
              persistentVolumeClaim:
                claimName: {{ include "ubs-agent.fullname" . }}-state
            {{- end }}
