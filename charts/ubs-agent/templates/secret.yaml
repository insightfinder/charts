apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ubs-agent.fullname" . }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ubs-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Rendered verbatim -- this is UBSAgent's whole config.yaml (see
  # config.py / README). Kept as a Secret rather than a ConfigMap because
  # config.insightfinder.licensekey has no env-var override.
  config.yaml: |
{{- toYaml .Values.config | nindent 4 }}
