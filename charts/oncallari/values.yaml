# Chart-wide values these templates reference. They were supplied by the
# insightfinder umbrella chart when these templates lived inside it; this is a
# standalone chart, so they are declared here. podAntiAffinity in particular
# must exist: the worker Deployment reads .Values.podAntiAffinity.enabled
# directly (not through `with`), so a missing map fails to render.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
podAntiAffinity:
  enabled: false
  topologyKey: kubernetes.io/hostname

ariOncallAgent:
  enabled: false
  affinity: {}
  nodeSelector: {}
  tolerations: []
  api:
    image:
      # The A2A/FastAPI process image (Dockerfile.api at the repo root) is
      # agent-kind-agnostic -- the same image backs the on-call agent's API
      # deployment and the Jenkins agent's (ariJenkinsAgent.api.image
      # below), differing only by this Deployment's AGENT_KIND/AGENT_NAME/
      # AGENT_PUBLIC_URL env. It never shells out to git/opencode/a build
      # toolchain itself, unlike the worker image below.
      repository: docker.io/insightfinderinc/ari-agent-api
      pullPolicy: Always
      # CI publishes a tag per branch (main/staging/test) plus a timestamped
      # one. "main" is not among those built yet, so it cannot be the default:
      # a release pinned to it fails ImagePullBackOff before anything else can
      # be diagnosed. Deploying a different branch is an install-time override,
      # not a chart edit:
      #   helm install ... --set ariOncallAgent.api.image.tag=main
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false
      # This chart is currently only deployed on the Traefik-ingress test
      # cluster -- override if a future environment uses a different
      # ingress controller.
      className: "traefik"
      annotations: {}
      hosts:
        - "ari-oncall-agent.insightfinder.com"
      tls:
        enabled: false
        # Left blank so Traefik falls back to its default TLSStore
        # (the cluster-wide *.insightfinder.com wildcard cert) instead of
        # looking for a named Secret that doesn't exist in this namespace.
        secretName: ""
      # This agent's own path prefix under the shared multi-agent domain
      # (see the top-level `sharedIngress` block below) -- independent of
      # `hosts` above, which is this agent's own dedicated-hostname
      # Ingress. Both can be enabled at once during a transition; neither
      # requires the other.
      sharedPath: "/ari-oncall"
  worker:
    image:
      # Built from Dockerfile.oncall at the repo root -- carries git plus
      # the go/java/maven toolchain `verify` needs against a real target
      # repo. Distinct from the Jenkins worker image (ariJenkinsAgent.worker
      # .image), which needs none of that.
      repository: docker.io/insightfinderinc/ari-oncall-agent-worker
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    # `verify` shells out to the target repository's own build tooling
    # (mvn/go/npm) inside this container, so what fits here is decided by
    # whichever repo the agent is pointed at, not by the agent itself.
    #
    # 2Gi was not enough, and had not been for a while. The repoCache note
    # below already called these "the frequent OOMKilled restarts this
    # worker was already hitting" -- but only the cache was moved out of
    # their way; the limit itself was left alone. Confirmed on stg
    # 2026-10-09 (workflow 5a0f4506): three OOMKills in eighteen minutes,
    # every one mid-verify, which broke the run outright. Memory went
    # 981Mi -> 1154Mi -> killed inside a single two-minute scrape window,
    # so the real peak is above 2Gi and is still unmeasured.
    #
    # 6Gi is headroom, not a measured ceiling. The stg node (t3a.2xlarge,
    # ~30Gi allocatable) sat at 60% of memory limits with this at 2Gi.
    #
    # Only this one block. The API deployments stay small on purpose --
    # that process never shells out to git, opencode or a build toolchain
    # (see its own image comment above), and measures 63Mi in steady state
    # on stg with no restart in its history.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 6Gi
  persistence:
    taskStore:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessMode: ReadWriteOnce
      size: 1Gi
    repoCache:
      # PVC-backed instead of the previous emptyDir: confirmed live that
      # emptyDir loses the whole mirror cache on every pod restart,
      # including the frequent OOMKilled restarts this worker was already
      # hitting (verify's build tooling is the main memory spike -- see
      # ariOncallAgent.worker.resources) -- so the cache was rarely warm
      # for more than a few hours at a time.
      enabled: true
      existingClaim: ""
      # This cluster's only StorageClass today is `gp3` (AWS EBS via
      # ebs.csi.aws.com), which is ReadWriteOnce-only -- see the PVC
      # template's own comment for why accessMode defaults to RWO rather
      # than RWX.
      storageClassName: ""
      accessMode: ReadWriteOnce
      # Kept small (5Gi) on purpose: the agent's own LRU eviction
      # (common/cache_gc.py) kicks in well before this fills, deleting the
      # least-recently-used repo mirrors first — see the agent's own
      # docs/design.md §6 and settings.cache_evict_low_water/high_water.
      size: 5Gi
    buildCache:
      # verify's own $HOME (mvn/go/npm dependency caches, ~/.m2/Go module
      # cache/~/.npm) — confirmed live there was previously no cache here
      # at all (not even emptyDir-backed, just the container's own
      # ephemeral root fs), so every single verify run paid a full cold
      # dependency download on top of the actual build/test, which was the
      # dominant reason verify routinely outlasted callers' own patience
      # timeouts (see the agent's own capabilities.yaml verify.timeout_seconds
      # and docs/design.md). Separate PVC from repoCache on purpose: this
      # one is written to by arbitrary build tooling the target repo
      # brings, not just git.
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessMode: ReadWriteOnce
      # Same LRU-eviction reasoning as repoCache above — kept small (5Gi)
      # on purpose, not sized to hold every dependency ever downloaded.
      size: 5Gi
  existingSecret: ""
  # This chart no longer deploys a Temporal server: every environment runs a
  # standalone, Flux-managed one (HelmRelease `temporal` in the insightfinder
  # namespace, test-fluxcd / eks-fluxcd), reached in-cluster over plaintext
  # gRPC. Its namespace-setup job registers temporalNamespace -- the worker
  # exits at startup if the namespace is missing, so add new ones there.
  temporalHost: "temporal-frontend:7233"
  temporalNamespace: "oncall-ari-agent"
  temporalTaskQueue: "oncall-ari-queue"
  temporalTlsEnabled: false
  temporalApiKey: ""
  # Base64-encoded 32-byte AES-256 key. When set, the agent encrypts every
  # workflow/activity payload before Temporal persists it, instead of
  # leaving request secrets (LLM api_key, repo pat/ssh_key) as plaintext in
  # Temporal's event history / Web UI. Generate one with:
  #   python3 -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  # Leave blank only for a throwaway/local install — required for any real deployment.
  temporalPayloadEncryptionKey: ""
  agentApiKeys: "change-me"
  agentName: "ARI On-Call Agent"
  agentPublicUrl: "https://ari-oncall-agent.insightfinder.com"
  sandboxRoot: "/var/lib/ari-agent/sandbox"
  repoCacheRoot: "/var/lib/ari-agent/repo-cache"
  buildCacheRoot: "/var/lib/ari-agent/build-cache"
  taskStoreRoot: "/var/lib/ari-agent/tasks"
  # Caps concurrent Temporal activities (clone/analyze/verify/... steps,
  # across all in-flight requests) this worker process runs at once —
  # Temporal's SDK default is 100, far more than the worker.resources
  # limits below can sustain once `verify`'s go/maven/npm build tooling is
  # in the mix. Confirmed live via repeated OOMKilled restarts. Raise only
  # alongside more CPU/memory in worker.resources.
  maxConcurrentActivities: 1
  # LRU-eviction thresholds shared by both repoCache and buildCache (see
  # common/cache_gc.py) — below cacheEvictLowWater fraction free on that
  # PVC, least-recently-used entries are deleted until back above
  # cacheEvictHighWater. Both PVCs are deliberately small (5Gi, see
  # persistence above), so eviction is expected to run regularly, not an
  # edge case.
  cacheEvictLowWater: 0.15
  cacheEvictHighWater: 0.30
  opencodeBin: "opencode"
  # publish_pr's primary path is deterministic (git subprocess + a direct
  # GitHub REST API call, see the agent's own docs/design.md §5) -- this
  # MCP server is kept only as its fallback for when that primary path
  # fails, still routed through a dedicated opencode agent.
  githubMcpServerUrl: "https://api.githubcopilot.com/mcp/"
  logLevel: "info"
  # OTLP/gRPC address of the InsightFinder trace server (the agent's
  # TRACE_SERVER_URL, same as mcp-service's), e.g.
  # http://traceserver-llm-labs.traceserver.svc.cluster.local:4618 on test.
  # Empty leaves tracing off. Set, a request is traced only when its caller
  # sends a `trace` block naming its own trace project -- the project is
  # never this deployment's choice.
  traceServerUrl: ""

# ARI Jenkins Agent -- a second, independently toggleable agent kind on the
# same chart, same shared Temporal server (its own namespace/task queue
# below), same shared api image (ariOncallAgent.api.image's own comment
# explains why). Deliberately no `persistence.repoCache` here: this agent
# never clones or builds a target repo -- every real Jenkins action goes
# through the target Jenkins's own MCP server
# (https://plugins.jenkins.io/mcp-server/) over HTTP from inside the worker
# pod, not a local checkout. Jenkins connection details themselves (base
# URL, auth token, CA bundle) are NOT chart config -- they travel in each
# A2A request's own `jenkins` DataPart, the same way the on-call agent's
# repo URL/PAT travels per-request rather than living in this Secret (see
# jenkins_agent/schemas.py).
#
# This chart currently only stands up "Mode A": a fully separate
# api+worker Deployment pair per agent kind. A single shared API process
# serving both agent kinds behind one Deployment ("Mode B") would need
# api/main.py itself to mount multiple agent kinds' A2A apps under path
# prefixes in one process -- not implemented yet, so there is no chart
# toggle for it. Both modes would use the same api image either way.
ariJenkinsAgent:
  enabled: false
  affinity: {}
  nodeSelector: {}
  tolerations: []
  api:
    image:
      repository: docker.io/insightfinderinc/ari-agent-api
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false
      className: "traefik"
      annotations: {}
      hosts:
        - "ari-jenkins-agent.insightfinder.com"
      tls:
        enabled: false
        secretName: ""
      # See ariOncallAgent.api.ingress.sharedPath's own comment.
      sharedPath: "/ari-jenkins"
  worker:
    image:
      # Built from Dockerfile.jenkins at the repo root -- node/opencode
      # only, no git or build toolchain (see that Dockerfile's own
      # comment for why).
      repository: docker.io/insightfinderinc/ari-jenkins-agent-worker
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  persistence:
    taskStore:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessMode: ReadWriteOnce
      size: 1Gi
  taskStoreRoot: "/var/lib/ari-agent/tasks"
  existingSecret: ""
  # Same standalone Temporal as ariOncallAgent (see its temporalHost comment).
  temporalHost: "temporal-frontend:7233"
  temporalNamespace: "jenkins-ari-agent"
  temporalTaskQueue: "jenkins-ari-queue"
  temporalTlsEnabled: false
  temporalApiKey: ""
  temporalPayloadEncryptionKey: ""
  agentApiKeys: "change-me"
  agentName: "ARI Jenkins Agent"
  agentPublicUrl: "https://ari-jenkins-agent.insightfinder.com"
  sandboxRoot: "/var/lib/ari-agent/sandbox"
  opencodeBin: "opencode"
  logLevel: "info"

ariActionAgent:
  # The `action` agent kind -- runs InsightFinder's registered Actions
  # from a conversation instead of a click (II-24921). Built and released
  # from its OWN repository, insightfinder/ari-agent-demo, not from
  # ari-oncall-agent like the other two kinds here.
  enabled: false
  affinity: {}
  nodeSelector: {}
  tolerations: []
  api:
    image:
      # NOT the shared ari-agent-api image. That image is "agent-kind
      # agnostic" only within one repository: it bakes in src/ and
      # configs/, so it contains the oncall and jenkins kinds and knows
      # nothing about `action`. This kind's API image is built from
      # ari-agent-demo's own Dockerfile.api.
      repository: docker.io/insightfinderinc/ari-agent-demo-api
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false
      className: "traefik"
      annotations: {}
      hosts:
        - "ari-action-agent.insightfinder.com"
      tls:
        enabled: false
        secretName: ""
      # See ariOncallAgent.api.ingress.sharedPath's own comment.
      sharedPath: "/ari-action"
  worker:
    image:
      # Built from Dockerfile.action in ari-agent-demo -- the smallest of
      # the three: no git, no build toolchain, no Node, no opencode.
      # It calls no InsightFinder backend API at all -- only the
      # target action server named in the request.
      repository: docker.io/insightfinderinc/ari-agent-demo-worker
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  existingSecret: ""
  # Same standalone Temporal as the other two kinds (see
  # ariOncallAgent.temporalHost's comment); its own namespace and queue.
  temporalHost: "temporal-frontend:7233"
  temporalNamespace: "action-ari-agent"
  temporalTaskQueue: "action-ari-queue"
  temporalTlsEnabled: false
  temporalApiKey: ""
  temporalPayloadEncryptionKey: ""
  agentApiKeys: "change-me"
  agentName: "ARI Action Agent"
  agentPublicUrl: "https://ari-action-agent.insightfinder.com"
  # Per-request scratch directory the shared engine expects. Nothing is
  # cloned into it -- there is no repo-cache PVC for this kind.
  sandboxRoot: "/var/lib/ari-agent/sandbox"
  logLevel: "info"
  # No opencodeBin: this kind has no opencode in its image at all.
  #
  # Note there is deliberately NO InsightFinder base_url / credential /
  # project here. Those arrive per-request in the A2A config DataPart, so
  # one deployment can serve several InsightFinder instances and a
  # compromised agent is not a standing key to any of them.

# ARI Kubernetes Agent -- the `k8s` agent kind (II-25173): checks Pod health
# and, after human approval, changes Deployment replicas, KEDA/HPA bounds
# or container CPU/memory. Same
# images repository as the oncall/jenkins kinds for the API; its own worker
# image. Only the worker talks to the Kubernetes API (see rbac below).
ariK8sAgent:
  enabled: false
  affinity: {}
  nodeSelector: {}
  tolerations: []
  api:
    image:
      repository: docker.io/insightfinderinc/ari-agent-api
      pullPolicy: Always
      tag: "test"
    # Must stay 1 (rendering fails otherwise): proposals waiting for
    # approval live in this pod's task store.
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      type: ClusterIP
    ingress:
      enabled: false
      className: "traefik"
      annotations: {}
      hosts:
        - "ari-k8s-agent.insightfinder.com"
      tls:
        enabled: false
        secretName: ""
      # See ariOncallAgent.api.ingress.sharedPath's own comment. Unlike the other
      # kinds, the shared Ingress routes this path only when `enabled` above is
      # also true: this agent holds cluster-wide patch rights, so turning on the
      # shared domain for another kind must not expose it too.
      sharedPath: "/ari-k8s"
  worker:
    image:
      repository: docker.io/insightfinderinc/ari-k8s-agent-worker
      pullPolicy: Always
      tag: "test"
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  persistence:
    # The API pod's A2A task store. A proposal paused for approval is
    # resolved against it when the approval arrives, so it has to survive
    # an API restart (the shared ari-agent-api image is redeployed on every
    # build). ReadWriteOnce, so the API Deployment uses Recreate and runs
    # one replica.
    taskStore:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      accessMode: ReadWriteOnce
      size: 1Gi
  # The worker runs as this ServiceAccount (the only pod of this kind with a
  # mounted token). Leave `name` empty for "<fullname>-k8s".
  serviceAccount:
    create: true
    name: ""
  # ClusterRole + ClusterRoleBinding, and a kube-system Role + RoleBinding
  # limited to the cluster-autoscaler-status ConfigMap (get). Rules match
  # ari-action-agent's docs/examples/k8s-rbac.yaml. Set create=false only if
  # you manage equivalent RBAC for the ServiceAccount yourself.
  rbac:
    create: true
  existingSecret: ""
  # Same standalone Temporal as the other kinds (see
  # ariOncallAgent.temporalHost's comment); its own namespace and queue.
  temporalHost: "temporal-frontend:7233"
  temporalNamespace: "k8s-ari-agent"
  temporalTaskQueue: "k8s-ari-queue"
  temporalTlsEnabled: false
  temporalApiKey: ""
  # Required (rendering fails without it, unless existingSecret is set): a base64-encoded 32-byte AES-256 key
  # that encrypts every workflow/activity payload before Temporal persists it
  # (otherwise request data sits in plaintext in Temporal's history / Web UI).
  # Preferred: reference a pre-existing Secret (used by BOTH the API and the
  # worker; takes precedence over temporalPayloadEncryptionKey below):
  #   temporalPayloadEncryptionKeySecret:
  #     name: my-ari-k8s-encryption-key
  #     key: TEMPORAL_PAYLOAD_ENCRYPTION_KEY
  # Generate a key with:
  #   python3 -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  temporalPayloadEncryptionKeySecret:
    name: ""
    key: "TEMPORAL_PAYLOAD_ENCRYPTION_KEY"
  # Fallback only (lands in this release's Secret, so in Helm release
  # state): the key value itself. Ignored when the Secret reference above is set.
  temporalPayloadEncryptionKey: ""
  # Required (rendering fails without it, or with "change-me"), unless
  # existingSecret is set: a key that can approve cluster-wide changes. Generate
  # one, e.g. `openssl rand -hex 24`; comma-separate several.
  agentApiKeys: ""
  agentName: "ARI Kubernetes Agent"
  agentPublicUrl: "https://ari-k8s-agent.insightfinder.com"
  # Lives on the worker's /tmp emptyDir (the root filesystem is read-only).
  sandboxRoot: "/tmp/ari-agent-sandbox"
  # API pod only: where persistence.taskStore is mounted.
  taskStoreRoot: "/var/lib/ari-agent/tasks"
  # Caps concurrent Temporal activities this worker runs at once. Unlike
  # the oncall kind (one heavy build at a time), these activities are light
  # API calls -- but an approved change holds its slot while it waits for
  # the rollout (up to the Deployment's progressDeadlineSeconds + 60s), so
  # 1 would make every other request queue behind a slow rollout.
  maxConcurrentActivities: 4
  logLevel: "info"
  # OTLP/gRPC address of the InsightFinder trace server, as for
  # ariOncallAgent.traceServerUrl. Empty leaves tracing off; set, a request
  # is traced only when its caller sends a `trace` block naming its own
  # trace project.
  traceServerUrl: ""

# One shared domain fronting every enabled agent kind's own API Service,
# path-routed (test-agents.insightfinder.com/ari-oncall,
# .../ari-jenkins, ...) instead of one hostname per agent kind --
# additive to each agent's own dedicated-hostname Ingress above, not a
# replacement for it; both can run at once. Routes to the *same* API
# Services/Deployments that already exist -- this does not merge agent
# kinds into one process (see docs/design.md's "Mode A vs Mode B" -- this
# is still Mode A underneath, just fronted by one Ingress). A caller
# reaching an agent this way needs that agent's `agentPublicUrl` set to
# the full path-prefixed URL (e.g. "https://test-agents.insightfinder.com
# /ari-oncall"), not the bare hostname, since that's what the Agent Card
# advertises as this agent's own address.
sharedIngress:
  enabled: false
  host: ""
  className: "traefik"
  annotations: {}
  tls:
    enabled: false
    secretName: ""

chatGateway:
  image:
    repository: docker.io/insightfinderinc/ari-chat-gateway
    pullPolicy: Always
    tag: "test"
  agentUrl: ""
  agentApiKey: ""
  existingSecret: ""
  secrets: {}
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi
  nodeSelector: {}
  tolerations: []
  slack:
    enabled: false
    persistence:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      size: 100Mi
  teams:
    enabled: false
    persistence:
      enabled: true
      existingClaim: ""
      storageClassName: ""
      size: 100Mi
    ingress:
      enabled: true
      className: "traefik"
      annotations: {}
      hosts: []
      path: "/teams/api/messages"
      tls:
        enabled: false
        secretName: ""
