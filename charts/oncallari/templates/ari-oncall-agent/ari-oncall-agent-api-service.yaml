{{- if .Values.ariOncallAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insightfinder.ariOncallAgentApiServiceName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ariOncallAgent.api.service.type }}
  selector:
    {{- include "insightfinder.selectorLabels" . | nindent 4 }}
    app: if-ari-oncall-agent-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
{{- end }}
