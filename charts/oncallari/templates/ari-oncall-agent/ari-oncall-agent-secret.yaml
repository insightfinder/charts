{{- if and .Values.ariOncallAgent.enabled (not .Values.ariOncallAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.ariOncallAgentSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
data:
  TEMPORAL_HOST: {{ .Values.ariOncallAgent.temporalHost | default "" | b64enc | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.ariOncallAgent.temporalNamespace | default "" | b64enc | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.ariOncallAgent.temporalTaskQueue | default "" | b64enc | quote }}
  TEMPORAL_TLS_ENABLED: {{ .Values.ariOncallAgent.temporalTlsEnabled | toString | b64enc | quote }}
  TEMPORAL_API_KEY: {{ .Values.ariOncallAgent.temporalApiKey | default "" | b64enc | quote }}
  AGENT_API_KEYS: {{ .Values.ariOncallAgent.agentApiKeys | default "" | b64enc | quote }}
  AGENT_NAME: {{ .Values.ariOncallAgent.agentName | default "" | b64enc | quote }}
  AGENT_PUBLIC_URL: {{ .Values.ariOncallAgent.agentPublicUrl | default "" | b64enc | quote }}
  SANDBOX_ROOT: {{ .Values.ariOncallAgent.sandboxRoot | default "" | b64enc | quote }}
  REPO_CACHE_ROOT: {{ .Values.ariOncallAgent.repoCacheRoot | default "" | b64enc | quote }}
  OPENCODE_BIN: {{ .Values.ariOncallAgent.opencodeBin | default "" | b64enc | quote }}
  GITHUB_MCP_SERVER_URL: {{ .Values.ariOncallAgent.githubMcpServerUrl | default "" | b64enc | quote }}
  LOG_LEVEL: {{ .Values.ariOncallAgent.logLevel | default "" | b64enc | quote }}
{{- end }}
