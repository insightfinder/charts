{{- if and .Values.ariActionAgent.enabled (not .Values.ariActionAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.ariActionAgentSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
{{/*
No OPENCODE_BIN here, unlike the other two agent kinds: this one has no
opencode and no Node runtime in its image at all. It makes exactly one
outbound call, to the demo's own action server
(action_agent/tools/action_server.py), and none to InsightFinder.

Nothing InsightFinder-specific lives in this Secret either. The target
deployment, its credential and the project scope all arrive per-request
in the A2A config DataPart, so this agent stores no InsightFinder
credential anywhere -- which is what lets one deployment serve several
InsightFinder instances.
*/}}
data:
  TEMPORAL_HOST: {{ .Values.ariActionAgent.temporalHost | default "" | b64enc | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.ariActionAgent.temporalNamespace | default "" | b64enc | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.ariActionAgent.temporalTaskQueue | default "" | b64enc | quote }}
  TEMPORAL_TLS_ENABLED: {{ .Values.ariActionAgent.temporalTlsEnabled | toString | b64enc | quote }}
  TEMPORAL_API_KEY: {{ .Values.ariActionAgent.temporalApiKey | default "" | b64enc | quote }}
  TEMPORAL_PAYLOAD_ENCRYPTION_KEY: {{ .Values.ariActionAgent.temporalPayloadEncryptionKey | default "" | b64enc | quote }}
  AGENT_API_KEYS: {{ .Values.ariActionAgent.agentApiKeys | default "" | b64enc | quote }}
  AGENT_NAME: {{ .Values.ariActionAgent.agentName | default "" | b64enc | quote }}
  AGENT_PUBLIC_URL: {{ .Values.ariActionAgent.agentPublicUrl | default "" | b64enc | quote }}
  SANDBOX_ROOT: {{ .Values.ariActionAgent.sandboxRoot | default "" | b64enc | quote }}
  LOG_LEVEL: {{ .Values.ariActionAgent.logLevel | default "" | b64enc | quote }}
{{- end }}
