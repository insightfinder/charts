{{- if and .Values.ariActionAgent.enabled .Values.ariActionAgent.api.ingress.enabled }}
{{- $ariActionAgentApiService := include "insightfinder.ariActionAgentApiServiceName" . }}
{{ $fullname := include "insightfinder.fullname" . }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-action-api-ingress" $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.ariActionAgent.api.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ariActionAgent.api.ingress.className }}
  {{- if and .Values.ariActionAgent.api.ingress.hosts .Values.ariActionAgent.api.ingress.tls.enabled }}
  tls:
    - hosts:
      {{- .Values.ariActionAgent.api.ingress.hosts | toYaml | nindent 6 }}
      {{- with .Values.ariActionAgent.api.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ariActionAgent.api.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $ariActionAgentApiService }}
              port:
                number: 80
    {{- end }}
{{- end }}
