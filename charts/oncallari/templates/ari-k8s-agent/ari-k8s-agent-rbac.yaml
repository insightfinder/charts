{{- if .Values.ariK8sAgent.enabled }}
{{- $name := include "insightfinder.ariK8sAgentServiceAccountName" . }}
{{- if .Values.ariK8sAgent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.ariK8sAgent.rbac.create }}
{{- if .Values.ariK8sAgent.serviceAccount.create }}
---
{{- end }}
{{- /*
Rules mirror ari-action-agent's docs/examples/k8s-rbac.yaml. Every resource
and verb is enumerated -- no wildcards -- and the agent can never read
Secrets, exec/attach/port-forward, create or delete anything, or touch RBAC.
Writes are cluster-wide by decision (II-25173).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
rules:
  # ---- read
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: [gitrepositories, ocirepositories, buckets, helmrepositories]
    verbs: [get, list]
  # ---- write (patch only; the scale subresource for replica changes)
  - apiGroups: ["apps"]
    resources: [deployments/scale, deployments]
    verbs: [patch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [patch]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Cluster Autoscaler's status, and nothing else in kube-system's ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
  namespace: kube-system
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
  namespace: kube-system
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
