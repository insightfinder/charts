{{- if .Values.ariK8sAgent.enabled }}
{{- $name := include "insightfinder.ariK8sAgentServiceAccountName" . }}
{{- if .Values.ariK8sAgent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.ariK8sAgent.rbac.create }}
{{- if .Values.ariK8sAgent.serviceAccount.create }}
---
{{- end }}
{{- /*
Rules mirror ari-action-agent's docs/examples/k8s-rbac.yaml. Every resource
and verb is enumerated -- no wildcards -- and the agent can never read
Secrets, exec/attach/port-forward, create anything, delete anything but a
pod, or touch RBAC.
Writes are cluster-wide.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
rules:
  # ---- read (exactly what src/k8s_agent/tools/client.py calls: no watches, and
  # the Flux objects are only ever fetched by name)
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list]
  # ---- read for listing resources. ConfigMaps and listing Flux objects are
  # not granted: a list returns ConfigMap values, and Helm values and source
  # URLs can hold credentials.
  - apiGroups: [""]
    resources: [services, persistentvolumes, namespaces, resourcequotas, limitranges]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [statefulsets, daemonsets, replicasets, controllerrevisions]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [get, list]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: [helmreleases]
    verbs: [get]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: [kustomizations]
    verbs: [get]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: [gitrepositories, ocirepositories, buckets, helmrepositories]
    verbs: [get]
  # ---- write (the scale subresource for replica changes)
  - apiGroups: ["apps"]
    resources: [deployments/scale, deployments, statefulsets, daemonsets]
    verbs: [patch]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [patch]
  - apiGroups: ["keda.sh"]
    resources: [scaledobjects]
    verbs: [patch]
  # In-place pod resize: the resize subresource accepts only container
  # CPU/memory; patching the pod itself stays denied.
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
  # Deleting a pod lets its controller replace it; nothing else is deleted.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "insightfinder.ariK8sAgentRbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Cluster Autoscaler's status, and nothing else in kube-system's ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
  namespace: kube-system
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
  namespace: kube-system
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-ca-status" (include "insightfinder.ariK8sAgentRbacName" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
