{{- if and .Values.ariK8sAgent.enabled (not .Values.ariK8sAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.ariK8sAgentSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
{{/*
TEMPORAL_PAYLOAD_ENCRYPTION_KEY is left out of this Secret when
temporalPayloadEncryptionKeySecret.name is set: both Deployments then take it
from that pre-existing Secret through a secretKeyRef (see the
insightfinder.ariK8sAgentEncryptionKeyEnv helper). An explicit env entry wins
over envFrom, so the key is never duplicated here.

No cluster credential lives in this Secret or in any request: the worker's
access to the cluster comes only from its ServiceAccount (see
ari-k8s-agent-rbac.yaml). The request's LLM key arrives per request in the
A2A config DataPart.
*/}}
data:
  TEMPORAL_HOST: {{ .Values.ariK8sAgent.temporalHost | default "" | b64enc | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.ariK8sAgent.temporalNamespace | default "" | b64enc | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.ariK8sAgent.temporalTaskQueue | default "" | b64enc | quote }}
  TEMPORAL_TLS_ENABLED: {{ .Values.ariK8sAgent.temporalTlsEnabled | toString | b64enc | quote }}
  TEMPORAL_API_KEY: {{ .Values.ariK8sAgent.temporalApiKey | default "" | b64enc | quote }}
  {{- if not .Values.ariK8sAgent.temporalPayloadEncryptionKeySecret.name }}
  TEMPORAL_PAYLOAD_ENCRYPTION_KEY: {{ .Values.ariK8sAgent.temporalPayloadEncryptionKey | default "" | b64enc | quote }}
  {{- end }}
  AGENT_API_KEYS: {{ .Values.ariK8sAgent.agentApiKeys | default "" | b64enc | quote }}
  AGENT_NAME: {{ .Values.ariK8sAgent.agentName | default "" | b64enc | quote }}
  AGENT_PUBLIC_URL: {{ .Values.ariK8sAgent.agentPublicUrl | default "" | b64enc | quote }}
  SANDBOX_ROOT: {{ .Values.ariK8sAgent.sandboxRoot | default "" | b64enc | quote }}
  TASK_STORE_ROOT: {{ (ternary .Values.ariK8sAgent.taskStoreRoot "" .Values.ariK8sAgent.persistence.taskStore.enabled) | b64enc | quote }}
  MAX_CONCURRENT_ACTIVITIES: {{ .Values.ariK8sAgent.maxConcurrentActivities | toString | b64enc | quote }}
  LOG_LEVEL: {{ .Values.ariK8sAgent.logLevel | default "" | b64enc | quote }}
  TRACE_SERVER_URL: {{ .Values.ariK8sAgent.traceServerUrl | default "" | b64enc | quote }}
{{- end }}
