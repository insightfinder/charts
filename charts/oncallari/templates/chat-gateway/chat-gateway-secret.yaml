{{- if or .Values.chatGateway.slack.enabled .Values.chatGateway.teams.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.chatGatewaySecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
data:
  ARI_API_KEY: {{ include "insightfinder.chatGatewayAgentApiKey" . | b64enc | quote }}
  {{- range $name, $value := .Values.chatGateway.secrets }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
