{{- $p := .Values.chatGateway.slack }}
{{- if $p.enabled }}
{{- $name := printf "%s-slack" (include "insightfinder.chatGatewayName" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "insightfinder.selectorLabels" . | nindent 6 }}
      app: {{ $name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "insightfinder.selectorLabels" . | nindent 8 }}
        app: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: slack
          image: "{{ .Values.chatGateway.image.repository }}:{{ .Values.chatGateway.image.tag }}"
          imagePullPolicy: {{ .Values.chatGateway.image.pullPolicy }}
          command: ["python", "-m", "chat_gateway", "slack"]
          env:
            {{- include "insightfinder.chatGatewayEnv" . | nindent 12 }}
            {{- if $p.persistence.enabled }}
            - name: SLACK_SESSION_FILE
              value: /data/sessions.json
            {{- end }}
          envFrom:
            {{- include "insightfinder.chatGatewayEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.chatGateway.resources | nindent 12 }}
          {{- if $p.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if $p.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.persistence.existingClaim | default $name }}
      {{- end }}
      {{- with .Values.chatGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chatGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
