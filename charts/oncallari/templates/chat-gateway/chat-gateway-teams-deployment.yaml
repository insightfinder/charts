{{- $p := .Values.chatGateway.teams }}
{{- if $p.enabled }}
{{- $name := printf "%s-teams" (include "insightfinder.chatGatewayName" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "insightfinder.selectorLabels" . | nindent 6 }}
      app: {{ $name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "insightfinder.selectorLabels" . | nindent 8 }}
        app: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: teams
          image: "{{ .Values.chatGateway.image.repository }}:{{ .Values.chatGateway.image.tag }}"
          imagePullPolicy: {{ .Values.chatGateway.image.pullPolicy }}
          command: ["python", "-m", "chat_gateway", "teams"]
          env:
            {{- include "insightfinder.chatGatewayEnv" . | nindent 12 }}
            {{- if $p.persistence.enabled }}
            - name: TEAMS_SESSION_FILE
              value: /data/sessions.json
            {{- end }}
            - name: TEAMS_PORT
              value: "3978"
            - name: TEAMS_MESSAGES_PATH
              value: {{ $p.ingress.path | quote }}
          ports:
            - name: http
              containerPort: 3978
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
          envFrom:
            {{- include "insightfinder.chatGatewayEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.chatGateway.resources | nindent 12 }}
          {{- if $p.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if $p.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $p.persistence.existingClaim | default $name }}
      {{- end }}
      {{- with .Values.chatGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.chatGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
