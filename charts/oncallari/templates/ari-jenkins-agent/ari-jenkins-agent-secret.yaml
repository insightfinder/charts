{{- if and .Values.ariJenkinsAgent.enabled (not .Values.ariJenkinsAgent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.ariJenkinsAgentSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
data:
  TEMPORAL_HOST: {{ .Values.ariJenkinsAgent.temporalHost | default "" | b64enc | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.ariJenkinsAgent.temporalNamespace | default "" | b64enc | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.ariJenkinsAgent.temporalTaskQueue | default "" | b64enc | quote }}
  TEMPORAL_TLS_ENABLED: {{ .Values.ariJenkinsAgent.temporalTlsEnabled | toString | b64enc | quote }}
  TEMPORAL_API_KEY: {{ .Values.ariJenkinsAgent.temporalApiKey | default "" | b64enc | quote }}
  TEMPORAL_PAYLOAD_ENCRYPTION_KEY: {{ .Values.ariJenkinsAgent.temporalPayloadEncryptionKey | default "" | b64enc | quote }}
  AGENT_API_KEYS: {{ .Values.ariJenkinsAgent.agentApiKeys | default "" | b64enc | quote }}
  AGENT_NAME: {{ .Values.ariJenkinsAgent.agentName | default "" | b64enc | quote }}
  AGENT_PUBLIC_URL: {{ .Values.ariJenkinsAgent.agentPublicUrl | default "" | b64enc | quote }}
  SANDBOX_ROOT: {{ .Values.ariJenkinsAgent.sandboxRoot | default "" | b64enc | quote }}
  OPENCODE_BIN: {{ .Values.ariJenkinsAgent.opencodeBin | default "" | b64enc | quote }}
  LOG_LEVEL: {{ .Values.ariJenkinsAgent.logLevel | default "" | b64enc | quote }}
{{- end }}
