{{- if include "insightfinder.coordinatorEnabled" . }}
{{- $name := include "insightfinder.coordinatorName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "insightfinder.selectorLabels" . | nindent 4 }}
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
