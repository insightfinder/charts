{{- if and (include "insightfinder.coordinatorEnabled" .) (not .Values.coordinator.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.coordinatorSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
data:
  AGENT_API_KEYS: {{ required "coordinator.agentApiKeys is required: the keys the chat gateways and CLI use" .Values.coordinator.agentApiKeys | b64enc | quote }}
  {{- range .Values.coordinator.agents }}
  {{ include "insightfinder.coordinatorKeyEnv" .name }}: {{ .apiKey | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
