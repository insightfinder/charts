{{- if include "insightfinder.coordinatorEnabled" . }}
{{- $name := include "insightfinder.coordinatorName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "insightfinder.selectorLabels" . | nindent 6 }}
      app: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/agents: {{ include (print $.Template.BasePath "/coordinator/coordinator-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "insightfinder.selectorLabels" . | nindent 8 }}
        app: {{ $name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          command: ["uvicorn", "coordinator.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: COORDINATOR_AGENTS_FILE
              value: /etc/ari-coordinator/agents.yaml
            - name: COORDINATOR_NAME
              value: {{ .Values.coordinator.name | quote }}
            - name: COORDINATOR_PUBLIC_URL
              value: {{ .Values.coordinator.publicUrl | default (printf "http://%s" $name) | quote }}
            {{- if .Values.coordinator.persistence.enabled }}
            - name: TASK_STORE_ROOT
              value: /var/lib/ari-coordinator/tasks
            {{- end }}
            {{- range $key, $value := .Values.coordinator.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "insightfinder.coordinatorSecretName" . }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
          volumeMounts:
            - name: agents
              mountPath: /etc/ari-coordinator
              readOnly: true
            {{- if .Values.coordinator.persistence.enabled }}
            - name: tasks
              mountPath: /var/lib/ari-coordinator
            {{- end }}
      volumes:
        - name: agents
          configMap:
            name: {{ $name }}
        {{- if .Values.coordinator.persistence.enabled }}
        - name: tasks
          persistentVolumeClaim:
            claimName: {{ .Values.coordinator.persistence.existingClaim | default $name }}
        {{- end }}
      {{- with .Values.coordinator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coordinator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
