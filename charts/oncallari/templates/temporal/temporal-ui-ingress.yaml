{{- if and .Values.temporal.enabled .Values.temporal.ingress.enabled }}
{{- $svcName := include "insightfinder.temporalServiceName" . }}
{{- $svcPort := .Values.temporal.dev.uiPort }}
{{- if eq .Values.temporal.mode "postgres" }}
{{- $svcName = include "insightfinder.temporalWebServiceName" . }}
{{- $svcPort = .Values.temporal.web.service.port }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insightfinder.temporalUiIngressName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.temporal.ingress.basicAuth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (include "insightfinder.temporalBasicAuthMiddlewareName" .) }}
    {{- end }}
    {{- with .Values.temporal.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.temporal.ingress.className }}
  {{- if .Values.temporal.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.temporal.ingress.host | quote }}
      {{- with .Values.temporal.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.temporal.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $svcPort }}
{{- end }}
