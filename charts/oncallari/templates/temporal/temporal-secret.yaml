{{- if and .Values.temporal.enabled (eq .Values.temporal.mode "postgres") (not .Values.temporal.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insightfinder.temporalSecretName" . }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.temporal.postgresql.password | default "" | b64enc | quote }}
{{- end }}
