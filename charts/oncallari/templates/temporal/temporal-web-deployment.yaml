{{- if and .Values.temporal.enabled (eq .Values.temporal.mode "postgres") .Values.temporal.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-temporal-web" (include "insightfinder.fullname" .) }}
  labels:
    {{- include "insightfinder.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "insightfinder.selectorLabels" . | nindent 6 }}
      app: if-temporal-web
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "insightfinder.selectorLabels" . | nindent 8 }}
        app: if-temporal-web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ printf "%s-temporal-web" .Chart.Name }}
          image: "{{ .Values.temporal.web.image.repository }}:{{ .Values.temporal.web.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: "{{ include "insightfinder.temporalServiceName" . }}:{{ .Values.temporal.service.port }}"
            {{- if .Values.temporal.web.corsOrigins }}
            - name: TEMPORAL_CORS_ORIGINS
              value: {{ .Values.temporal.web.corsOrigins | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.temporal.resources | nindent 12 }}
      {{- with .Values.temporal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.temporal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
