apiVersion: v2
name: temporal
description: >
  Temporal workflow engine (server + dedicated Postgres) backing the ARI
  on-call code-analysis-fix agent's CodeAnalysisFixWorkflow
  (ActionAIAgent/services/github-agent). Not a shared/multi-tenant Temporal
  install -- exists to give that one workflow a durable backend. Other
  services can point their own client at this same server later (a single
  Temporal server serves multiple task queues/namespaces fine) rather than
  standing up a second one.
type: application
version: 0.1.0
appVersion: "1.22"
