apiVersion: v1
kind: Secret
metadata:
  name: {{ include "temporal.fullname" . }}-postgres
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed two ways: the postgres:16 container reads POSTGRES_USER/
  # POSTGRES_PASSWORD/POSTGRES_DB (its own image's env var names);
  # temporalio/auto-setup reads POSTGRES_USER/POSTGRES_PWD (a different name
  # for the same password) -- both sets live in one Secret so each container
  # picks up only the keys it recognizes via envFrom.
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_PWD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
