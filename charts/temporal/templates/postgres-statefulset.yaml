apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "temporal.fullname" . }}-postgres
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "temporal.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "temporal.fullname" . }}-postgres
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "temporal.fullname" . }}-postgres
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - secretRef:
            name: {{ include "temporal.fullname" . }}-postgres
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        {{- if .Values.postgres.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        {{- end }}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "{{ .Values.postgres.username }}"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "{{ .Values.postgres.username }}"]
          initialDelaySeconds: 15
          periodSeconds: 20
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.postgres.persistence.storageClassName }}
      storageClassName: {{ .Values.postgres.persistence.storageClassName }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
