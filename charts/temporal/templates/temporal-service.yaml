apiVersion: v1
kind: Service
metadata:
  name: {{ include "temporal.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "temporal.fullname" . }}
  ports:
  - port: {{ .Values.temporal.port }}
    targetPort: 7233
    name: grpc
