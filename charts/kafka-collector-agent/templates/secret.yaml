{{- if or .Values.ssl.keystoreBase64 .Values.ssl.truststoreBase64 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka-collector-agent.fullname" . }}-ssl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-collector-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.ssl.keystoreBase64 }}
  client.jks: {{ .Values.ssl.keystoreBase64 }}
  {{- end }}
  {{- if .Values.ssl.truststoreBase64 }}
  clienttrust.jks: {{ .Values.ssl.truststoreBase64 }}
  {{- end }}
{{- end }}
